[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests", ".agents/verification"]
addopts = "--strict-markers"
markers = [
    "slow_numerical: materially expensive numerical regression tests, zero discovery baselines, and full artifact suites",
]

[tool.mypy]
ignore_missing_imports = true
warn_unused_ignores = false

[tool.pyright]
reportMissingImports = "none"
reportMissingTypeStubs = "none"
reportMissingModuleSource = "none"
reportGeneralTypeIssues = "none"
reportUnknownMemberType = "none"
extraPaths = ["."]

[tool.pyrefly]
python-interpreter-path = "C:/Development/anaconda3/python.exe"
search-path = [
    ".",
    "C:/Development/anaconda3/Lib/site-packages",
    "C:/Users/Audna/AppData/Roaming/Python/Python310/site-packages",
]

[tool.pyrefly.errors]
missing-source = "ignore"
missing-source-for-stubs = "ignore"
missing-import = "ignore"
missing-module-attribute = "ignore"
