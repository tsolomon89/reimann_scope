name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  python-ci:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12"]

    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Check git diff whitespace
      run: |
        git diff --check HEAD~1 HEAD

    - name: Smoke check module imports
      run: |
        python -c "import app, math_core, transcendental, transforms, reference_data, research_runner, zero_finder, certification; print('All core modules imported successfully.')"

    - name: Validate experiment schemas
      run: |
        python -c "import glob, yaml, research_runner; [research_runner.validate_spec(yaml.safe_load(open(f, encoding='utf-8')))[0] or exit(f'Invalid spec {f}') for f in glob.glob('research/experiments/*.yaml')]; print('All experiment schemas validated successfully.')"

    - name: Verify data provenance
      run: |
        python -c "import reference_data; assert reference_data.verify_provenance(), 'Data provenance checksums failed'; print('Data provenance checksums verified.')"

    - name: Verify strict certificates (read-only)
      run: |
        python scripts/verify_certificates.py --check

    - name: Validate all canonical run bundles
      run: |
        python research_runner.py validate

    - name: Assert clean worktree after verification
      run: |
        git diff --exit-code
        test -z "$(git status --porcelain)"

    - name: Run full pytest test suite (including first-100 baseline)
      run: |
        python -m pytest tests/test_first_100_zeros.py
        python -m pytest

    - name: Dash application smoke test
      run: |
        python -c "import app; assert app.app.layout is not None; print('Dash application initialized successfully.')"


  lean-ci:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Install elan
      run: |
        curl https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh -sSf | sh -s -- -y --default-toolchain none
        echo "$HOME/.elan/bin" >> $GITHUB_PATH

    - name: Build Lean formalization and verify build report
      run: |
        cd formal
        lake build
        cd ..
        python -c "import certification; ok, errs = certification.verify_formal_build_report(); assert ok, f'Formal report failed: {errs}'; print('Formal build report verified.')"
