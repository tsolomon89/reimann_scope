schema_version: '2'
id: cross-height-distance-001
title: Cross-Height Trajectory Distance and Norm Sweep
research_question: What is the maximum geometric deviation between derivative-normalized
  paths P_n(u) across different zero heights?
epistemic_class: observational_pattern
object_relationship: actual_cross_height_comparison
hypothesis:
  statement: Derivative-normalized paths P_n(u) from different height blocks lie within
    an O(Delta_n) bounded envelope around the leading linear term u.
prediction:
  statement: Normalized path distances ||P_m - P_n|| remain bounded by 2.0 on u in
    [-0.5, 0.5].
falsification:
  statement: Path distance diverges on compact sampling intervals.
interpretation_limit:
  statement: Bounded trajectory distance reflects local asymptotic Taylor structure;
    it is not a proof of spectral rigidity.
criterion:
  metric: max_distance
  operator: <=
  threshold: '2.0'
  aggregation: max
report_metrics:
- metric: max_distance
  kind: criterion_component
  label: Maximum normalized trajectory distance ||P_m - P_n||
engine:
  operation: cross_height_distance
parameters:
  block_pair:
    kind: explicit
    values:
    - low_to_medium
    - low_to_high
    - low_to_very_high
  u_max:
    kind: explicit
    values:
    - '0.5'
precision:
  dps: 80
outputs:
  retain_points: true
