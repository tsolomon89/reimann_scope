schema_version: '2'
id: symmetric-centrifuge-defect-001
title: Symmetric Centrifuge Defect and Discrete Hyperbolic Amplification
research_question: Does the symmetric centrifuge defect D_K satisfy the exact hyperbolic
  identity across grades?
epistemic_class: exact_control
object_relationship: grade_constraint_comparison
hypothesis:
  statement: The bilateral defect D_K(rho) = (tau^(K*delta) - 1)*(1 - tau^(-K*delta))
    satisfies |D_K| = 4*sinh^2(K*delta*ln(tau)/2) identically.
prediction:
  statement: Defect identity error is below 1e-45.
falsification:
  statement: Identity error exceeds 1e-45.
interpretation_limit:
  statement: Algebraic identity for symmetric radial divergence.
formalization_target:
  statement: Symmetric centrifuge defect identity.
criterion:
  metric: identity_error
  operator: <=
  threshold: 1e-45
  aggregation: max_abs
report_metrics:
- metric: identity_error
  kind: criterion_component
  label: Defect identity absolute error
engine:
  operation: symmetric_centrifuge
parameters:
  delta:
    kind: explicit
    values:
    - '-0.1'
    - '-0.01'
    - '0.0'
    - '0.01'
    - '0.1'
  K:
    kind: linear
    start: '-10'
    stop: '10'
    step: '2'
  gamma:
    kind: explicit
    values:
    - '14.13472514173469379045725198356247027078425711569924317568556746'
precision:
  dps: 80
outputs:
  retain_points: true
