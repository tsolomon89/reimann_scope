schema_version: '2'
id: grade-constraints-001
title: Bilateral Symmetric Defect and Hyperbolic Scaling Invariant Sweep
research_question: Does the discrete bilateral defect D_K(rho) satisfy the hyperbolic
  identity |D_K| = 4 * sinh^2(K * delta * ln(tau) / 2) across integer grades?
epistemic_class: exact_control
object_relationship: grade_constraint_comparison
hypothesis:
  statement: The bilateral defect D_K = (tau^(K*delta) - 1)*(1 - tau^(-K*delta)) satisfies
    |D_K| = 4*sinh^2(K*delta*ln(tau)/2) identically, vanishing if and only if delta
    = 0 or K = 0.
prediction:
  statement: Identity error | |D_K| - 4*sinh^2(K*delta*ln(tau)/2) | is below 1e-50
    across all K and delta.
falsification:
  statement: Identity error exceeds 1e-50.
interpretation_limit:
  statement: This algebraic identity holds for all complex numbers; it confirms hyperbolic
    amplification of off-line roots without asserting RH.
formalization_target:
  statement: Hyperbolic identity for bilateral grade defect D_K.
criterion:
  metric: identity_error
  operator: <=
  threshold: 1e-50
  aggregation: max_abs
report_metrics:
- metric: abs_D_K
  kind: observational_metric
  label: Observed bilateral defect magnitude |D_K|
- metric: expected_abs_D_K
  kind: observational_metric
  label: Theoretically expected defect magnitude 4*sinh^2(K*delta*ln(tau)/2)
- metric: identity_error
  kind: criterion_component
  label: Defect identity absolute error
engine:
  operation: grade_constraint
parameters:
  zero_index:
    kind: explicit
    values:
    - 0
  delta:
    kind: explicit
    values:
    - '-0.1'
    - '-0.01'
    - '0.0'
    - '0.01'
    - '0.1'
  K:
    kind: integer_grade
    start: -10
    stop: 10
    step: 1
precision:
  dps: 80
outputs:
  retain_points: true
