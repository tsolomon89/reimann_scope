schema_version: '2'
id: coupled-scale-covariance-001
title: Coupled Coordinate/Converter Scale Covariance Verification
research_question: Does the coupled transformation (s' = A*s, x' = x^(1/A)) preserve
  complex trace and prime-power wave contributions C_J(x, rho) = C_J(x^(1/A), A*rho)?
epistemic_class: exact_control
object_relationship: same_object_coordinate_control
hypothesis:
  statement: Under dilation s' = A*s and variable transformation x' = x^(1/A), the
    exponent s' log x' = s log x is invariant, ensuring C_J(x', rho') = C_J(x, rho)
    identically for exact components.
prediction:
  statement: Exact covariance residuals for zeta values and single-zero C_J converter waves are below 1e-45; finite-m C_pi residual is an expected truncation diagnostic.
falsification:
  statement: Exact covariance residual exceeds 1e-45.
interpretation_limit:
  statement: Exact coupled covariance gauge identity between domain dilation and exponential
    prime variable scaling; fixed-m C_pi series truncation error is diagnostic and does not violate exact covariance.
formalization_target:
  statement: Coupled scale covariance theorem for Riemann explicit formula.
criterion:
  metric: covariance_residual
  operator: <=
  threshold: 1e-45
  aggregation: max_abs
report_metrics:
- metric: zeta_covariance_residual
  kind: criterion_component
  label: Zeta function domain trace covariance residual
- metric: cj_covariance_residual
  kind: criterion_component
  label: Single-zero prime wave C_J covariance residual
- metric: cpi_covariance_residual
  kind: fixed_m_truncation_diagnostic
  label: Single-zero prime wave C_pi truncation diagnostic (fixed m-cutoff)
engine:
  operation: zeta_trace_compare
parameters:
  k:
    kind: linear
    start: '-2.0'
    stop: '2.0'
    step: '0.5'
  delta:
    kind: explicit
    values:
    - '0.0'
    - '0.05'
  gamma:
    kind: explicit
    values:
    - '14.13472514173469379045725198356247027078425711569924317568556746'
  x:
    kind: explicit
    values:
    - '10.0'
    - '20.0'
    - '50.0'
precision:
  dps: 80
outputs:
  retain_points: true
