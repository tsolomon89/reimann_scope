schema_version: "1"
id: coupled-perturbation-covariance-001
title: Coupled coordinate covariance invariance of clean and perturbed converter waves

hypothesis:
  statement: >
    Under simultaneous origin coordinate dilation A = tau^k, s' = A*s, x' = x^(1/A),
    rho_clean' = A*rho_clean, and rho_pert' = A*rho_pert, both clean single-zero converter
    contributions C_J(x', rho_clean') = C_J(x, rho_clean) and perturbed converter contributions
    C_J(x', rho_pert') = C_J(x, rho_pert) are exact mathematical identities, achieving maximum
    absolute covariance residual <= 1e-25 across single-pair diagnostic and symmetry-complete
    split modes at 80 dps.

criterion:
  metric: covariance_residual
  operator: "<="
  threshold: "1e-25"
  aggregation: max_abs

report_metrics:
  - metric: clean_cj_residual
    label: "Clean converter wave covariance residual |C_J(x^(1/A), A*rho_0) - C_J(x, rho_0)|"
    kind: criterion_component
  - metric: pert_cj_residual
    label: "Perturbed converter wave covariance residual |C_J(x^(1/A), A*rho_pert) - C_J(x, rho_pert)|"
    kind: criterion_component
  - metric: delta_cj_residual
    label: "Converter perturbation response covariance residual |Delta C_J' - Delta C_J|"
    kind: criterion_component

engine:
  operation: coupled_perturbation_covariance

parameters:
  zero_index:
    kind: explicit
    values: ["0", "1"]
  delta:
    kind: explicit
    values: ["-0.01", "0.0", "0.01"]
  k:
    kind: explicit
    values: ["-2", "-1", "0", "1", "2"]
  x:
    kind: explicit
    values: ["10.0", "20.0"]
  num_zeros:
    kind: explicit
    values: ["10"]
  perturbation_mode:
    kind: explicit
    values: ["single_pair_diagnostic", "symmetry_complete_split"]

precision:
  dps: 80

outputs:
  retain_points: true
