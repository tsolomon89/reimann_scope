schema_version: '2'
id: coupled-perturbation-covariance-001
title: Coupled Perturbation Covariance and Gauge Invariance
research_question: Does the coupled coordinate/converter gauge covariance hold identically
  for perturbed off-line roots and reflection-symmetric pairs?
epistemic_class: exact_control
object_relationship: same_object_coordinate_control
hypothesis:
  statement: Coupled scale covariance C_J(x^(1/A), A*rho_pert) = C_J(x, rho_pert)
    holds for arbitrary off-line roots rho_pert = 1/2 + delta + i*gamma.
prediction:
  statement: Perturbed converter wave covariance residual is below 1e-45.
falsification:
  statement: Covariance residual exceeds 1e-45.
interpretation_limit:
  statement: Confirms that gauge covariance is an algebraic property of the explicit
    formula kernel holding for arbitrary complex exponents.
formalization_target:
  statement: Perturbed explicit formula covariance theorem.
criterion:
  metric: covariance_residual
  operator: <=
  threshold: 1e-45
  aggregation: max_abs
report_metrics:
- metric: clean_cj_residual
  kind: criterion_component
  label: Unperturbed wave covariance residual
- metric: pert_cj_residual
  kind: criterion_component
  label: Perturbed wave covariance residual
- metric: delta_cj_residual
  kind: criterion_component
  label: Wave perturbation difference covariance residual
engine:
  operation: coupled_perturbation_covariance
parameters:
  k:
    kind: linear
    start: '-1.0'
    stop: '1.0'
    step: '0.5'
  delta:
    kind: explicit
    values:
    - '-0.1'
    - '-0.01'
    - '0.0'
    - '0.01'
    - '0.1'
  zero_index:
    kind: explicit
    values:
    - 0
    - 1
  perturbation_mode:
    kind: explicit
    values:
    - single_pair_diagnostic
    - symmetry_complete_split
  x:
    kind: explicit
    values:
    - '20.0'
precision:
  dps: 80
outputs:
  retain_points: true
