schema_version: '2'
id: centrifuge-slope-verification
title: Radial Centrifuge Logarithmic Slope Verification
research_question: Does the radial centrifuge log |q_rho^K| have exact linear slope
  delta * ln(tau) with respect to grade K?
epistemic_class: exact_control
object_relationship: grade_constraint_comparison
hypothesis:
  statement: The discrete radial amplification factor satisfies d/dK [ log |q_rho^K|
    ] = delta * ln(tau) identically.
prediction:
  statement: Absolute slope error |slope - delta*ln(tau)| is below 1e-45.
falsification:
  statement: Slope error exceeds 1e-45.
interpretation_limit:
  statement: Exact logarithmic slope identity for geometric scaling factor.
formalization_target:
  statement: Radial centrifuge logarithmic slope identity.
criterion:
  metric: abs_slope_error
  operator: <=
  threshold: 1e-45
  aggregation: max_abs
report_metrics:
- metric: abs_slope_error
  kind: criterion_component
  label: Absolute slope error
engine:
  operation: centrifuge
parameters:
  delta:
    kind: linear
    start: '-0.1'
    stop: '0.1'
    step: '0.02'
  K_max:
    kind: explicit
    values:
    - '20'
precision:
  dps: 80
outputs:
  retain_points: true
