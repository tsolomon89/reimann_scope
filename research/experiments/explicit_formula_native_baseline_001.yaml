schema_version: '2'
id: explicit-formula-native-baseline-001
title: Riemann–Weil Explicit Formula Native Baseline Residuals
research_question: Does the authoritative Riemann–Weil explicit formula vanish across predetermined test functions at native grade K=0 within declared truncation budgets?
epistemic_class: observational_pattern
object_relationship: same_object_coordinate_control
hypothesis:
  statement: For admissible modulated Gaussian packets H_j (j=1..6), the native explicit formula residual EF[H_j; D_zeta, A_zeta] = Spectral_Sum - (Pole + Prime + Gamma) vanishes within the observational zero-sum and prime-sum truncation bounds.
prediction:
  statement: The absolute explicit formula residual is below 1e-15 across all test functions j=1..6.
falsification:
  statement: Residual exceeds 1e-15 under 200 reference zeros and 50000 prime sieve.
interpretation_limit:
  statement: High-precision observational validation of native explicit formula components, normalization, signs, and truncation behavior.
formalization_target:
  statement: Riemann–Weil explicit formula native baseline.
criterion:
  metric: residual
  operator: <=
  threshold: 1e-15
  aggregation: max_abs
report_metrics:
- metric: residual
  kind: criterion_component
  label: Explicit formula absolute residual
- metric: relative_error
  kind: criterion_component
  label: Relative error
- metric: spectral_cutoff_change_100_to_200
  kind: criterion_component
  label: Spectral cutoff sensitivity (100 to 200 zeros)
- metric: spectral_cutoff_change_150_to_200
  kind: criterion_component
  label: Spectral cutoff sensitivity (150 to 200 zeros)
- metric: prime_cutoff_change_10k_to_50k
  kind: criterion_component
  label: Arithmetic prime cutoff sensitivity (10k to 50k)
- metric: precision_change_70_to_110
  kind: criterion_component
  label: Working precision sensitivity (70 to 110 dps)
engine:
  operation: explicit_formula_native_baseline
parameters:
  j:
    kind: explicit
    values:
    - 1
    - 2
    - 3
    - 4
    - 5
    - 6
  k:
    kind: explicit
    values:
    - 0
  prime_cutoff:
    kind: explicit
    values:
    - 50000
precision:
  dps: 80
outputs:
  retain_points: true
