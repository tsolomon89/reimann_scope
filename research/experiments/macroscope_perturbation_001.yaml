schema_version: "1"
id: macroscope-perturbation-001
title: Coupled macroscope scaling of off-critical zero perturbations in explicit formula reconstruction

hypothesis:
  statement: >
    Under simultaneous origin coordinate dilation A = tau^k and synthetic zero perturbation delta != 0,
    the arithmetic residual Delta pi_N is measured under coupled coordinate normalization
    across both single-pair diagnostic and symmetry-complete quartet modes at 80 dps.

criterion:
  metric: residual
  operator: ">="
  threshold: "0.0"

report_metrics:
  - metric: delta_cj
    label: "Isolated single-zero J contribution shift Delta C_J"
    kind: perturbation_response
  - metric: delta_cpi
    label: "Isolated single-zero pi contribution shift Delta C_pi"
    kind: perturbation_response
  - metric: delta_pi_n
    label: "Full spectrum reconstructed prime count shift Delta pi_N(x)"
    kind: perturbation_response

engine:
  operation: converter_perturbation


parameters:
  zero_index:
    kind: explicit
    values: ["0", "1"]
  delta:
    kind: explicit
    values: ["-0.01", "0.0", "0.01"]
  k:
    kind: explicit
    values: ["-2", "-1", "0", "1", "2"]
  x:
    kind: explicit
    values: ["10.0", "20.0"]
  num_zeros:
    kind: explicit
    values: ["10"]
  perturbation_mode:
    kind: explicit
    values: ["single_pair_diagnostic", "symmetry_complete_quartet"]

precision:
  dps: 80

outputs:
  retain_points: true
