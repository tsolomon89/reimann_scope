schema_version: "1"
id: isolated-radial-response-002
title: Isolated off-critical radial response and symmetric split defect in prime reconstruction

classification: observational response
notes: "Characterizes single-pair response and symmetry-complete split defect across delta in [-0.05, 0.05]"

hypothesis:
  statement: >
    Characterize the isolated zero converter response and the symmetric split defect
    S_J(delta) = C_J(x, 1/2+delta+igamma) + C_J(x, 1/2-delta+igamma) - 2*C_J(x, 1/2+igamma)
    and S_pi(delta) across single-pair diagnostic and symmetry-complete split modes at 80 dps.
    Observational experiment characterizing even symmetry S(-delta) = S(delta), baseline vanishing
    S(0) = 0, and local quadratic scaling without asserting an artificial pass/fail threshold.

criterion:
  metric: residual
  aggregation: none

report_metrics:
  - metric: delta_cj
    label: "Single-zero J contribution shift Delta C_J"
    kind: perturbation_response
  - metric: delta_cpi
    label: "Single-zero pi contribution shift Delta C_pi"
    kind: perturbation_response
  - metric: delta_pi_n
    label: "Full spectrum prime count shift Delta pi_N(x)"
    kind: perturbation_response
  - metric: split_defect_cj
    label: "Symmetric split defect S_J(delta) = C_J(rho_+) + C_J(rho_-) - 2*C_J(rho_0)"
    kind: perturbation_response
  - metric: split_defect_cpi
    label: "Symmetric split defect S_pi(delta) = C_pi(rho_+) + C_pi(rho_-) - 2*C_pi(rho_0)"
    kind: perturbation_response
  - metric: split_defect_pi_n
    label: "Symmetric split reconstructed prime shift S_pi_N(x)"
    kind: perturbation_response
  - metric: symmetry_error_cj
    label: "Split defect J even symmetry error |S_J(delta) - S_J(-delta)|"
    kind: fixed_m_truncation_diagnostic
  - metric: symmetry_error_cpi
    label: "Split defect pi even symmetry error |S_pi(delta) - S_pi(-delta)|"
    kind: fixed_m_truncation_diagnostic
  - metric: symmetry_error
    label: "Split defect max even symmetry error max(|S_J - S_J(-delta)|, |S_pi - S_pi(-delta)|)"
    kind: fixed_m_truncation_diagnostic
  - metric: normalized_quadratic_cj
    label: "Normalized quadratic split defect S_J(delta) / delta^2"
    kind: fixed_m_truncation_diagnostic
  - metric: normalized_quadratic_cpi
    label: "Normalized quadratic split defect S_pi(delta) / delta^2"
    kind: fixed_m_truncation_diagnostic
  - metric: quadratic_ratio_cj
    label: "Quadratic scaling ratio S_J(delta) / S_J(delta/2)"
    kind: fixed_m_truncation_diagnostic
  - metric: quadratic_ratio_cpi
    label: "Quadratic scaling ratio S_pi(delta) / S_pi(delta/2)"
    kind: fixed_m_truncation_diagnostic
  - metric: quadratic_ratio_error_cj
    label: "Quadratic scaling error |S_J(delta)/S_J(delta/2) - 4|"
    kind: fixed_m_truncation_diagnostic
  - metric: quadratic_ratio_error_cpi
    label: "Quadratic scaling error |S_pi(delta)/S_pi(delta/2) - 4|"
    kind: fixed_m_truncation_diagnostic

engine:
  operation: converter_perturbation

parameters:
  zero_index:
    kind: explicit
    values: ["0", "1", "2"]
  delta:
    kind: explicit
    values: [
      "-0.05",
      "-0.01",
      "-0.005",
      "-0.001",
      "-0.0005",
      "0.0",
      "0.0005",
      "0.001",
      "0.005",
      "0.01",
      "0.05"
    ]
  x:
    kind: explicit
    values: ["10.0", "20.0", "50.0"]
  num_zeros:
    kind: explicit
    values: ["10"]
  perturbation_mode:
    kind: explicit
    values: ["single_pair_diagnostic", "symmetry_complete_split"]

precision:
  dps: 80

outputs:
  retain_points: true
