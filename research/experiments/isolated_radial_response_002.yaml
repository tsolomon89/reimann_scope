schema_version: '2'
id: isolated-radial-response-002
title: Isolated Radial Perturbation and Wave-Component Sensitivity Sweep
research_question: What is the sensitivity and defect signature of the explicit formula
  prime count pi_N(x) and single-zero waves C_J(x, rho), C_pi(x, rho) under isolated
  off-line perturbation?
epistemic_class: sensitivity_diagnostic
object_relationship: synthetic_modified_object
hypothesis:
  statement: Off-line zero perturbation delta != 0 induces a continuous, non-zero
    deviation in explicit-formula prime reconstruction waves C_J, C_pi and total pi_N(x).
prediction:
  statement: Explicit formula reconstruction error delta_pi(x) deviates monotonically
    from clean baseline with respect to delta.
falsification:
  statement: Reconstruction diff exhibits discontinuous or unbounded divergence at
    delta = 0.
interpretation_limit:
  statement: Sensitivity diagnostic characterizing response of explicit formula to
    synthetic off-line zeros.
criterion:
  metric: residual
  aggregation: none
report_metrics:
- metric: clean_cj
  kind: observational_metric
  label: Unperturbed C_J(x, rho)
- metric: perturbed_cj
  kind: observational_metric
  label: Perturbed C_J(x, rho_pert)
- metric: clean_cpi
  kind: observational_metric
  label: Unperturbed C_pi(x, rho)
- metric: perturbed_cpi
  kind: observational_metric
  label: Perturbed C_pi(x, rho_pert)
- metric: full_reconstruction_diff
  kind: observational_metric
  label: Full explicit formula difference pi_pert(x) - pi_clean(x)
engine:
  operation: converter_perturbation
parameters:
  delta:
    kind: linear
    start: '-0.1'
    stop: '0.1'
    step: '0.02'
  zero_index:
    kind: explicit
    values:
    - 0
    - 1
  perturbation_mode:
    kind: explicit
    values:
    - single_pair_diagnostic
    - symmetry_complete_split
  x:
    kind: explicit
    values:
    - '20.0'
    - '50.0'
precision:
  dps: 80
outputs:
  retain_points: true
