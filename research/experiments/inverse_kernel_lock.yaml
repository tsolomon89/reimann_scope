schema_version: '2'
id: inverse-kernel-lock-identity
title: Inverse Scale Lock Kernel Lab Identity Verification
research_question: Does the Dirichlet kernel transform Z_{A,B,C,D}(s) identically
  reproduce zeta(s) when AB = 1 and C = D = 0?
epistemic_class: exact_control
object_relationship: same_object_coordinate_control
hypothesis:
  statement: Under inverse scale lock AB = 1 and C = D = 0, Z_{A,1/A,0,0}(s) = zeta(s)
    identically for all s.
prediction:
  statement: Absolute difference |Z_{A,1/A,0,0}(s) - zeta(s)| is below 1e-45.
falsification:
  statement: Difference exceeds 1e-45.
interpretation_limit:
  statement: Exact algebraic identity for locked Dirichlet kernel dilation.
formalization_target:
  statement: Inverse scale lock kernel theorem.
criterion:
  metric: abs_diff
  operator: <=
  threshold: 1e-45
  aggregation: max_abs
report_metrics:
- metric: abs_diff
  kind: criterion_component
  label: Kernel identity absolute difference
engine:
  operation: kernel_identity
parameters:
  A:
    kind: linear
    start: '0.2'
    stop: '5.0'
    step: '0.4'
  inverse_scale_lock:
    kind: explicit
    values:
    - 'true'
  s_re:
    kind: explicit
    values:
    - '0.5'
    - '1.5'
    - '2.0'
  s_im:
    kind: explicit
    values:
    - '14.13472514173469379045725198356247027078425711569924317568556746'
precision:
  dps: 80
outputs:
  retain_points: true
